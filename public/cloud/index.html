<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clouds Demo</title>
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
      "addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
    }
  }
  </script>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>
<body>
  <div class="container" id="container">
    <!-- Centered animated SVG used as a background visual behind the clouds -->
    <div class="bg-svg-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" class="bg-svg">
        <defs>
          <pattern id="slidePattern" patternUnits="userSpaceOnUse" width="1000" height="200"></pattern>
        </defs>
        <text x="50" y="150" font-size="160" fill="url(#slidePattern)">PAGADAA !</text>
      </svg>

      <script>
        (function(){
          const pattern = document.getElementById("slidePattern");
          const colors = ["#FF6B6B", "#FFD93D", "#6BCB77", "#4D96FF", "#FF922B", "#845EC2"];
          const columns = 20;
          const segmentHeight = 50;

          for (let i = 0; i < columns; i++) {
            const x = i * 50;
            for (let j = 0; j < 8; j++) {
              const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
              rect.setAttribute("x", x);
              rect.setAttribute("y", j * segmentHeight);
              rect.setAttribute("width", 50);
              rect.setAttribute("height", segmentHeight);
              rect.setAttribute("fill", colors[Math.floor(Math.random() * colors.length)]);
              pattern.appendChild(rect);

               anime({
                targets: rect,
                translateY: [
                  { value: -20 + Math.random() * 40, duration: 100 + Math.random() * 100 },
                  { value: 0, duration: 1000 + Math.random() * 100 }
                ],
                easing: 'easeInOutSine',
                loop: true,
                direction: 'alternate',
                delay: Math.random() * 1000
              });
            }
          }
        })();
      </script>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
